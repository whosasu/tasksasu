<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#ffffff">
<title>Tasks ASÜ</title>
<style>
  /* ══ theme tokens (Google Keep palette) ══ */
  :root {
    --bg:#ffffff; --surface:#ffffff; --surface2:#f1f3f4; --border:#e3e5e8;
    --text:#202124; --sub:#5f6368; --muted:#80868b;
    --accent:#1a73e8; --accent-soft:#e8f0fe;
    --done:#1a73e8;
    --shadow:0 1px 2px rgba(60,64,67,.15), 0 2px 8px rgba(60,64,67,.08);
    --shadow-lift:0 8px 28px rgba(60,64,67,.22);
  }
  .dark {
    --bg:#1f1f1f; --surface:#2d2e30; --surface2:#3c4043; --border:#444746;
    --text:#e8eaed; --sub:#9aa0a6; --muted:#80868b;
    --accent:#8ab4f8; --accent-soft:#2b3a52;
    --done:#8ab4f8;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 2px 10px rgba(0,0,0,.25);
    --shadow-lift:0 10px 32px rgba(0,0,0,.5);
    color-scheme: dark;
  }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  *{touch-action:pan-x pan-y}input,select,textarea{font-size:16px}html,body { height:100%; -webkit-text-size-adjust:100%; }
  body {
    background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
    display:flex; justify-content:center;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior:none;
    user-select:none;
    -webkit-user-select:none;
    -webkit-touch-callout:none;
  }
  .app {
    position:relative; width:100%; max-width:440px; height:100dvh;
    background:var(--bg); color:var(--text);
    display:flex; flex-direction:column; overflow:hidden;
    box-shadow:0 0 60px rgba(0,0,0,.18);
    transition:background .25s, color .25s;
  }
  button, input, textarea, select { font-family:inherit; color:inherit; }
  button { cursor:pointer; border:none; background:none; }

  /* ══ screens (home + list pages, one at a time) ══ */
  .screen {
    position:absolute; inset:0; display:none; flex-direction:column;
    background:var(--bg);
    padding-top:env(safe-area-inset-top);
  }
  .screen.active { display:flex; animation:pageIn .18s ease; }
  @keyframes pageIn { from{opacity:.4} to{opacity:1} }

  /* ══ header ══ */
  .topbar {
    display:flex; align-items:center; gap:10px;
    padding:14px 16px 8px;
  }
  .logo {
    width:30px; height:30px; border-radius:9px; flex-shrink:0;
    background:linear-gradient(135deg,#4aa3f0,#2fc98d);
    display:grid; place-items:center; font-size:14px;
  }
  .topbar h1 {
    font-size:21px; font-weight:600; letter-spacing:-.2px; flex:1;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .ibtn {
    width:40px; height:40px; border-radius:50%; color:var(--sub);
    display:grid; place-items:center; transition:.15s; flex-shrink:0;
  }
  .ibtn:hover { background:var(--surface2); }
  .searchwrap { padding:4px 16px 10px; }
  .searchpill {
    display:flex; align-items:center; gap:10px;
    background:var(--surface2); border-radius:99px; padding:11px 16px;
  }
  .searchpill input {
    flex:1; background:none; border:none; outline:none;
    font-size:14.5px; color:var(--text);
  }
  .searchpill input::placeholder { color:var(--muted); }

  .sect-label {
    font-size:12.5px; color:var(--sub); font-weight:500;
    margin:14px 2px 10px;
  }

  /* ══ Keep-style cards ══ */
  .cardgrid { display:grid; grid-template-columns:1fr 1fr; gap:12px; padding:0 2px; align-items:start; }
  @media (min-width:400px) { .cardgrid { grid-template-columns:1fr 1fr; } }
  .card {
    margin-bottom:0; width:100%; text-align:left;
    border-radius:12px; box-shadow:var(--shadow); position:relative;
    transition:transform .12s ease, box-shadow .12s ease;
    overflow:hidden;
  }
  .card:hover { box-shadow:var(--shadow-lift); }
  .card:active { transform:scale(.97); }
  .card .inner { padding:12px 14px 13px; }
  .card h3 {
    font-size:14.5px; font-weight:600; line-height:1.35; margin-bottom:8px;
    display:flex; align-items:flex-start; gap:6px;
  }
  .card h3 .em { font-size:14px; line-height:1.1; }
  .cmini { display:flex; align-items:flex-start; gap:8px; padding:2.5px 0; }
  .cmini .box {
    width:13px; height:13px; border-radius:3.5px; margin-top:2px; flex-shrink:0;
    border:2px solid currentColor; opacity:.55;
  }
  .cmini p {
    font-size:12.5px; line-height:1.45;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .ticked { font-size:11.5px; opacity:.72; margin-top:8px; }
  .allclear { font-size:12.5px; opacity:.65; font-style:italic; padding:2px 0; }
  .card .stylebtn {
    position:absolute; top:7px; right:7px; width:28px; height:28px;
    border-radius:50%; display:grid; place-items:center;
    opacity:0; transition:.15s;
  }
  .card:hover .stylebtn { opacity:1; }
  .card .stylebtn:focus { opacity:1; }
  .newlist-float {
    position:absolute; left:50%; transform:translateX(-50%);
    bottom:calc(80px + env(safe-area-inset-bottom)); z-index:26;
    padding:12px 26px; border-radius:99px; white-space:nowrap;
    background:var(--surface); border:1px solid var(--border);
    color:var(--text); font-size:14px; font-weight:600;
    box-shadow:var(--shadow-lift); transition:transform .15s;
  }
  .newlist-float:hover { transform:translateX(-50%) scale(1.04); }
  .newlist-float:active { transform:translateX(-50%) scale(.96); }
  .hint { text-align:center; font-size:11px; color:var(--muted); margin:18px 0 8px; }

  /* ══ list page rows (Google Tasks style) ══ */
  .metarow { display:flex; align-items:center; gap:10px; padding:2px 18px 6px; }
  .segmented {
    margin-left:auto; display:flex; background:var(--surface2);
    border-radius:99px; padding:2.5px; gap:2px;
  }
  .seg { font-size:11.5px; font-weight:600; color:var(--sub); padding:5px 12px; border-radius:99px; transition:.15s; }
  .seg.active { background:var(--surface); color:var(--text); box-shadow:0 1px 2px rgba(0,0,0,.12); }

  .rows { padding:2px 10px 8px; overflow-y:auto; flex:1; }
  .row {
    display:flex; align-items:flex-start; gap:13px;
    padding:13px 8px; border-radius:14px; transition:.12s;
  }
  .row:hover { background:var(--surface2); }
  .check {
    width:21px; height:21px; border-radius:50%; flex-shrink:0; margin-top:2px;
    border:2px solid var(--muted); display:grid; place-items:center;
    color:transparent; transition:.12s;
  }
  .check:hover { border-color:var(--done); color:var(--done); }
  .check.done { background:var(--done); border-color:var(--done); color:#fff; }
  .row.done { opacity:.55; }
  .row .body { flex:1; min-width:0; }
  .row .title { font-size:15.5px; line-height:1.4; word-break:break-word; }
  .row.done .title { text-decoration:line-through; }
  .row .note { font-size:12.5px; line-height:1.45; color:var(--sub); margin-top:2px; word-break:break-word; }
  /* tiny watch-status dot, always to the right of the title (Movies / Series / Anime) */
  .hasdot { display:flex; align-items:center; }
  .hasdot .ttext { min-width:0; }
  .sdot {
    flex:none; display:inline-flex; align-items:center; justify-content:center;
    width:19px; height:19px; border-radius:50%; background:transparent;
    border:none; padding:0; margin-left:6px; cursor:pointer;
  }
  .sdot::before {
    content:''; width:8px; height:8px; border-radius:50%; background:#9aa0a6;
    transition: background-color .2s ease, box-shadow .2s ease;
  }
  .sdot.st-towatch::before  { background:#34c759; box-shadow:0 0 5px 1px rgba(52,199,89,.8); }
  .sdot.st-watching::before { background:#fbbc04; box-shadow:0 0 5px 1px rgba(251,188,4,.85); }
  .pill {
    display:inline-flex; align-items:center; gap:6px; margin-top:9px;
    border:1px solid var(--border); border-radius:9px;
    padding:4.5px 11px; font-size:11.5px; font-weight:600; color:var(--sub);
    background:var(--surface);
  }
  .pill.overdue { border-color:#f28b82; color:#c5221f; }
  .dark .pill.overdue { border-color:#a1423c; color:#f28b82; }
  .starbtn { margin-top:2px; padding:6px; color:var(--muted); transition:.12s; border-radius:50%; }
  .starbtn:hover { background:var(--surface2); }
  .starbtn.on { color:var(--accent); }

  /* ══ grocery (MinimaList style) ══ */
  .aisle { padding:0 18px; margin-top:20px; }
  .aisle h3 {
    font-size:15px; font-weight:700; display:flex; align-items:center; gap:8px;
    padding-bottom:8px; margin-bottom:2px; border-bottom:1px solid var(--border);
  }
  .g-row {
    display:flex; align-items:center; gap:13px; padding:12px 4px;
    border-radius:12px;
  }
  .g-row:hover { background:var(--surface2); }
  .g-row .title { font-size:15px; line-height:1.4; }
  .g-row.done { opacity:.5; }
  .g-row.done .title { text-decoration:line-through; }

  .clearbtn {
    display:flex; align-items:center; justify-content:center; gap:6px;
    padding:7px 12px; border-radius:99px; white-space:nowrap;
    flex:0 1 auto; min-width:0; overflow:hidden;
    border:1px solid var(--border); color:var(--sub); font-size:11.5px; font-weight:600; transition:.15s;
  }
  .clearbtn:hover { border-color:var(--muted); color:var(--text); }
  .clearbtn.dim { opacity:.5; }

  .card,.card *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  .rowwrap *,.g-row *{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}

  /* ══ FAB + bottom nav (Keep toolbar) ══ */
  .fab {
    position:absolute; right:18px; bottom:calc(86px + env(safe-area-inset-bottom));
    width:58px; height:58px; border-radius:18px; z-index:30;
    background:var(--surface); box-shadow:var(--shadow-lift);
    display:grid; place-items:center; transition:transform .12s;
  }
  .fab:active { transform:scale(.93); }
  .fab .plus { font-size:30px; font-weight:300; color:var(--accent); line-height:1; }
  .bottomnav {
    position:fixed; left:0; right:0; bottom:0; margin:0 auto; max-width:440px; z-index:25;
    background:var(--surface2); border-top:1px solid var(--border);
    display:flex; padding:8px 8px calc(7px + env(safe-area-inset-bottom));
  }
  .navbtn {
    flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
    color:var(--muted); font-size:10px; font-weight:700; letter-spacing:.3px;
    padding:5px 0; border-radius:12px; transition:.15s;
  }
  .navbtn:hover { color:var(--text); }
  .navbtn.active { color:var(--accent); }

  /* ══ sheets ══ */
  .backdrop {
    position:absolute; inset:0; z-index:40; background:rgba(0,0,0,.42);
    display:none; animation:fade .18s ease;
  }
  .backdrop.open { display:block; }
  @keyframes fade { from{opacity:0} to{opacity:1} }
  .sheet {
    position:absolute; left:0; right:0; bottom:0; z-index:50;
    background:var(--surface); border-radius:26px 26px 0 0;
    transform:translateY(105%); transition:transform .28s cubic-bezier(.32,.72,0,1);
    max-height:88%; overflow-y:auto;
    box-shadow:var(--shadow-lift);
  }
  .sheet.open { transform:translateY(0); }
  .grabber { width:38px; height:4.5px; border-radius:99px; background:var(--border); margin:11px auto 4px; }
  .sheet-head {
    display:flex; align-items:center; gap:8px;
    padding:10px 20px 12px;
  }
  .sheet-head h2 { font-size:16.5px; font-weight:650; flex:1; }
  .sheet .content { padding:4px 20px calc(28px + env(safe-area-inset-bottom)); }
  .slabel {
    font-size:11px; font-weight:700; letter-spacing:1px; text-transform:uppercase;
    color:var(--muted); margin:18px 0 10px;
  }
  .slabel:first-child { margin-top:4px; }
  .field {
    width:100%; background:var(--surface2); border:none; border-radius:12px;
    padding:12px 14px; font-size:14.5px; outline:none; transition:.15s;
  }
  .field:focus { box-shadow:0 0 0 2px var(--accent); }
  textarea.field { resize:none; }
  .row2 { display:flex; gap:10px; }
  .chip {
    padding:8px 14px; border-radius:99px; font-size:12.5px; font-weight:600;
    background:var(--surface2); color:var(--sub); transition:.12s;
  }
  .chip:hover { color:var(--text); }
  .chip.on { background:var(--accent); color:#fff; }
  .dark .chip.on { color:#1f2937; }
  .btn {
    width:100%; padding:13px; border-radius:99px; font-size:14px; font-weight:650;
    transition:.15s;
  }
  .btn.primary { background:var(--accent); color:#fff; }
  .dark .btn.primary { color:#1f2937; }
  .btn.primary:active { transform:scale(.98); }
  .btn.ghost { border:1px solid var(--border); color:var(--text); margin-top:10px; }
  .btn.danger { color:#d93025; border:1px solid var(--border); margin-top:10px; }
  .dark .btn.danger { color:#f28b82; }

  .setting {
    display:flex; align-items:center; gap:13px; padding:13px 2px;
  }
  .setting .ic {
    width:36px; height:36px; border-radius:11px; display:grid; place-items:center;
    background:var(--accent-soft); color:var(--accent); flex-shrink:0;
  }
  .setting .tx { flex:1; min-width:0; }
  .setting .tx p { font-size:13.5px; font-weight:600; }
  .setting .tx small { font-size:11px; color:var(--sub); display:block; margin-top:2px; line-height:1.5; }
  .toggle {
    width:44px; height:26px; border-radius:99px; background:var(--border);
    position:relative; transition:.2s; flex-shrink:0;
  }
  .toggle::after {
    content:''; position:absolute; top:3px; left:3px;
    width:20px; height:20px; border-radius:99px; background:#fff; transition:.2s;
    box-shadow:0 1px 3px rgba(0,0,0,.25);
  }
  .toggle.on { background:var(--accent); }
  .toggle.on::after { left:21px; }

  /* theme pick */
  .themepick { display:flex; gap:10px; }
  .themeopt {
    flex:1; padding:14px; border-radius:16px; border:2px solid var(--border);
    display:flex; flex-direction:column; align-items:center; gap:8px;
    font-size:13px; font-weight:650; color:var(--sub); transition:.15s;
  }
  .themeopt.on { border-color:var(--accent); color:var(--accent); background:var(--accent-soft); }

  /* style picker */
  .swatches { display:flex; flex-wrap:wrap; gap:10px; }
  .swatch {
    width:38px; height:38px; border-radius:50%; border:2px solid transparent;
    transition:transform .12s; box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);
  }
  .swatch:hover { transform:scale(1.12); }
  .swatch.on { border-color:var(--accent); transform:scale(1.12); }
  .grads { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .grad {
    height:52px; border-radius:12px; border:2px solid transparent; transition:.12s;
  }
  .grad:hover { transform:scale(1.03); }
  .grad.on { border-color:var(--accent); }
  .stylepreview {
    height:100px; border-radius:16px; overflow:hidden; position:relative;
    display:flex; align-items:flex-end; padding:13px 15px; font-size:14px; font-weight:650;
    box-shadow:var(--shadow); margin-bottom:6px;
  }

  /* menu */
  .menu {
    position:absolute; right:12px; top:56px; z-index:35; min-width:180px;
    background:var(--surface); border:1px solid var(--border); border-radius:14px;
    padding:6px; display:none; box-shadow:var(--shadow-lift);
  }
  .menu.open { display:block; animation:fade .13s ease; }
  .menu button {
    width:100%; text-align:left; padding:11px 14px; font-size:13.5px;
    border-radius:10px; color:var(--text);
  }
  .menu button:hover { background:var(--surface2); }
  .menu button.danger { color:#d93025; }
  .dark .menu button.danger { color:#f28b82; }

  /* toast */
  .toast {
    position:absolute; left:50%; bottom:calc(150px + env(safe-area-inset-bottom));
    z-index:99; transform:translate(-50%,14px);
    background:#323639; color:#f1f3f4; font-size:13px; font-weight:570;
    padding:11px 18px; border-radius:99px; opacity:0; pointer-events:none;
    transition:.25s; box-shadow:var(--shadow-lift); max-width:82%; text-align:center;
  }
  .dark .toast { background:#5f6368; }
  .toast.show { opacity:1; transform:translate(-50%,0); }

  /* row swipe actions + pull-to-add */
  .rowwrap { position:relative; overflow:hidden; border-radius:12px; }
  .rowact {
    position:absolute; top:0; bottom:0; display:flex; align-items:center; overflow:hidden;
    font-size:12.5px; font-weight:700; color:#fff; letter-spacing:.2px;
    white-space:nowrap; box-sizing:border-box;
    width:0; opacity:0; z-index:1; transition:width .18s ease, opacity .12s ease;
  }
  .rowwrap.swiping .rowact { transition:none; }
  .rowwrap .row, .rowwrap .g-row { position:relative; z-index:2; }
  .rowwrap.swiping[data-dir="right"] .rowact.left { width:var(--sw,0px); opacity:1; }
  .rowwrap.swiping[data-dir="left"] .rowact.right { width:var(--sw,0px); opacity:1; }
  .rowact.left { left:0; background:#d93025; padding-left:14px; }
  .rowact.right { right:0; background:#188038; padding-right:14px; justify-content:flex-end; }
  .rowwrap .row, .rowwrap .g-row { background:var(--bg); position:relative; z-index:2; border-radius:0; }
  .rowwrap .row.done, .rowwrap .g-row.done { opacity:1; }
  .rowwrap .row.done .title, .rowwrap .row.done .note, .rowwrap .g-row.done .title { color:var(--muted); }
  .pull-hint {
    position:absolute; left:50%; top:14px; transform:translate(-50%,-8px);
    z-index:60; background:var(--surface); color:var(--sub); border:1px solid var(--border);
    font-size:12px; font-weight:600; padding:8px 16px; border-radius:99px;
    opacity:0; pointer-events:none; transition:.18s; box-shadow:var(--shadow);
  }
  .pull-hint.show { opacity:1; transform:translate(-50%,0); }
  select.field { appearance:none; -webkit-appearance:none; }

  .empty { text-align:center; color:var(--muted); padding:52px 20px; font-size:14px; line-height:1.7; }

  /* ══ TEST round: full UI reworks · motion · touch ══ */
  button, .chip, .ibtn, .seg, .navbtn, .themeopt, .toggle, .swatch, .grad, .menu button { touch-action: manipulation; }

  /* base motion + frosted chrome (all styles) */
  .card { transition: transform .16s cubic-bezier(.2,.8,.3,1.15), box-shadow .16s ease; }
  .card:active { transform: scale(.97); }
  .row { transition: background .15s ease, transform .12s ease, opacity .18s ease; }
  .topbar, .bottomnav { background: rgba(255,255,255,.78); -webkit-backdrop-filter: blur(18px) saturate(1.6); backdrop-filter: blur(18px) saturate(1.6); }
  
  @keyframes confetti-fall { 0% { transform: translateY(-12px) rotate(0deg); opacity:1 } 100% { transform: translateY(92vh) rotate(720deg); opacity:.12 } }
  .confetti-bit { position:fixed; top:0; width:9px; height:14px; border-radius:2px; z-index:999; pointer-events:none; animation: confetti-fall 1.5s ease-in forwards; }

  /* R32: quiet-check completion fx (preview #8) */
  #fx-overlay { position:fixed; inset:0; z-index:9999; touch-action:none; -webkit-tap-highlight-color:transparent; }
  #fx-check { position:absolute; left:50%; top:42%; transform:translate(-50%,-50%); animation:fxpop .55s cubic-bezier(.2,.9,.3,1.2) forwards; }
  #fx-check svg path { stroke-dasharray:80; stroke-dashoffset:80; animation:fxdash .5s .05s ease forwards; }
  @keyframes fxpop { 0%{opacity:0;transform:translate(-50%,-50%) scale(.7)} 40%{opacity:1;transform:translate(-50%,-50%) scale(1.06)} 100%{opacity:1;transform:translate(-50%,-50%) scale(1)} }
  @keyframes fxdash { to { stroke-dashoffset:0 } }
  #fx-canvas { position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:10000; }
  .dot { width:14px; height:14px; border-radius:50%; display:inline-block; margin-right:8px; vertical-align:-2px; border:1px solid rgba(0,0,0,.14); }
  #toast { pointer-events:none; }
  #toast .taction { margin-left:14px; background:transparent; border:0; color:var(--accent); font-weight:800; letter-spacing:.5px; font-size:12.5px; cursor:pointer; padding:4px 6px; pointer-events:auto; }

  /* ═══ DARK — sleek night ═══ */
  .dark { --bg:#14161a; --surface:#1d2026; --surface2:#272b33; --border:#333944; --text:#eef1f6; --sub:#9aa4b2; --muted:#6b7480; --accent:#5b9dff; --accent-soft:#1e2c44; --done:#5b9dff; --shadow:0 4px 18px rgba(0,0,0,.42); --shadow-lift:0 16px 44px rgba(0,0,0,.55); color-scheme:dark; }
  .dark .topbar, .dark .bottomnav { background: rgba(20,22,26,.72); }
  .dark .card { border:1px solid #2c313b; border-radius:17px; box-shadow:0 8px 26px rgba(0,0,0,.42); }
  .dark .rowwrap { border-radius:15px; }
  .dark .pill, .dark .chip { background:#242932; border:1px solid #343b46; }
  .dark .sdot { box-shadow: 0 0 10px rgba(91,157,255,.55); }

  /* ═══ BRUTAL — brutalist mono ═══ */
  .theme-sharp { --bg:#ffffff; --surface:#ffffff; --surface2:#f0f0f0; --border:#111111; --text:#000000; --sub:#333333; --muted:#777777; --accent:#000000; --accent-soft:#eeeeee; --done:#000000; --shadow:7px 7px 0 #000; --shadow-lift:10px 10px 0 #000; }
  .theme-sharp .topbar { background:#000; color:#fff; border-bottom:3px solid #000; -webkit-backdrop-filter:none; backdrop-filter:none; }

  .theme-sharp .check.done { background:#000; }
  .theme-sharp .pill, .theme-sharp .chip, .theme-sharp .seg, .theme-sharp .field, .theme-sharp .setting, .theme-sharp .clearbtn, .theme-sharp .menu button, .theme-sharp .themeopt, .theme-sharp .rowact { border-radius:0; text-transform:uppercase; letter-spacing:1.4px; font-size:10.5px; font-weight:800; }
  .theme-sharp .pill, .theme-sharp .metarow { font-family:ui-monospace,'SF Mono',Menlo,monospace; }

  /* ═══ CANDY — sticker comic ═══ */
  .theme-playful { --bg:#fff3e6; --surface:#fffdf8; --surface2:#ffe9d2; --border:#ffb27a; --text:#3a2210; --sub:#96552a; --muted:#c98a58; --accent:#ff6b35; --accent-soft:#ffe1c9; --done:#2e9e44; --shadow:5px 5px 0 rgba(58,34,16,.9); --shadow-lift:8px 8px 0 rgba(58,34,16,.9); }

  .theme-playful .seg.active { background:var(--accent); color:#fff; }
  .theme-playful .bottomnav { margin:0 12px calc(10px + env(safe-area-inset-bottom)); border:3px solid var(--text); border-radius:999px; box-shadow:5px 5px 0 var(--text); background:#fff; }
  .theme-playful .navbtn.active { color:var(--accent); }
  .theme-playful .sheet { border-radius:32px 32px 0 0; border-top:3px solid var(--text); }
  .theme-playful .grabber { width:70px; height:6px; background:var(--text); }
  .theme-playful .newlist-float { background:var(--accent); border:3px solid var(--text); border-radius:999px; box-shadow:5px 5px 0 var(--text); font-weight:800; }
  .theme-playful .slabel { text-transform:uppercase; letter-spacing:1.6px; color:var(--accent); }

  /* ═══ EDITORIAL — magazine serif ═══ */
  .theme-editorial { --bg:#faf7f2; --surface:#ffffff; --surface2:#f3eee5; --border:#e2d8c5; --text:#211a12; --sub:#6b5c46; --muted:#a08c6c; --accent:#7a1f2b; --accent-soft:#f3e0e2; --done:#7a1f2b; --shadow:0 1px 0 rgba(122,31,43,.16); --shadow-lift:0 12px 30px rgba(80,50,20,.18); }
  .theme-editorial .title { font-family: ui-serif,'New York',Georgia,serif; font-size:17px; font-weight:600; letter-spacing:.1px; }

  .theme-editorial .card { border-radius:2px; border:1px solid var(--border); box-shadow:none; background:#fff; padding:22px 18px; }

  .theme-editorial .navbtn { text-transform:uppercase; letter-spacing:1.4px; }
  .theme-editorial .navbtn.active { color:var(--accent); }
  .theme-editorial .newlist-float { background:var(--accent); border-radius:2px; box-shadow:none; letter-spacing:1.5px; text-transform:uppercase; }

  /* ═══ PRO — dense work mode ═══ */
  .theme-compact { --bg:#f4f5f7; --surface:#ffffff; --surface2:#eceef2; --border:#dcdfe4; --text:#12161c; --sub:#525a66; --muted:#88909c; --accent:#0b57d0; --accent-soft:#e6eefc; --done:#0b57d0; }
  .theme-compact .cardgrid { gap:8px; grid-template-columns:1fr 1fr 1fr; }

  /* touch: no hover ghosts */
  @media (hover: none) {
    .ibtn:hover { background:transparent; }

<body>

<div class="app" id="app">

  <!-- ══════════ HOME ══════════ -->
  <div class="screen active" id="screen-home">
    <div class="topbar">
      <div class="logo"><img src="logo.png"" alt="logo" style="width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block"></div>
      <h1>Tasks ASÜ</h1>
      <button class="ibtn" onclick="gotoPage('settings')" aria-label="Settings">

      </button>
    </div>
    <div class="searchwrap">
      <div class="searchpill">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="color:var(--muted)"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="search" placeholder="Search" oninput="renderHome()">
      </div>
    </div>
    <div class="rows" id="home-content" style="padding:0 14px 120px"></div>
  </div>

  <!-- ══════════ LIST PAGE (one box at a time) ══════════ -->

    <div class="topbar">
      <button class="ibtn" onclick="goHome()" aria-label="Back">

      </button>
      <div class="menu" id="menu">
        <button onclick="closeMenu();openRename()">Rename list</button>
        <button onclick="closeMenu();openStyleForCurrent()">Change background</button>
        <button onclick="closeMenu();toggleDueSort()">Sort by due date</button>
        <button onclick="closeMenu();clearCompleted()">Remove completed</button>
        <button class="danger" onclick="closeMenu();deleteCurrentList()">Delete list</button>
      </div>
    </div>
    <div class="metarow">
      <div id="clear-slot"></div>
      <div class="segmented" id="segs">
        <button class="seg active" onclick="setFilter('all',this)">All</button>
        <button class="seg" onclick="setFilter('open',this)">Open</button>
        <button class="seg" onclick="setFilter('done',this)">Done</button>
      </div>
    </div>
    <div class="rows" id="list-content"></div>
  </div>

    <div class="metarow">
      <div id="todo-clear"></div>
      <div class="segmented" id="segs-todo">
        <button class="seg active" onclick="setFilter('all',this,'todo')">All</button>
        <button class="seg" onclick="setFilter('open',this,'todo')">Open</button>
        <button class="seg" onclick="setFilter('done',this,'todo')">Done</button>
      </div>
    </div>
    <div class="rows" id="todo-content"></div>
  </div>

  <!-- ══════════ GROCERY PAGE (bottom-nav page) ══════════ -->

      <h1>🛒 Grocery</h1>
    </div>
    <div class="metarow">
      <div id="grocery-clear"></div>
      <div class="segmented" id="segs-grocery">
        <button class="seg active" onclick="setFilter('all',this,'grocery')">All</button>
        <button class="seg" onclick="setFilter('open',this,'grocery')">Open</button>
        <button class="seg" onclick="setFilter('done',this,'grocery')">Done</button>
      </div>
    </div>
    <div class="rows" id="grocery-content"></div>
  </div>

  <!-- ══════════ NAV ══════════ -->
  <nav class="bottomnav">
    <button class="navbtn active" id="nav-lists" onclick="gotoPage('home')">

      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 2l1.5 4M18 2l-1.5 4"/><path d="M3 6h18l-2 12a3 3 0 01-3 2.6H8A3 3 0 015 18z"/><path d="M9 11a3 3 0 006 0"/></svg>

  <!-- floating "New list", home only -->
  <button class="newlist-float" id="newlist-float" onclick="openNameSheet('new')">+ New list</button>

  <!-- ══════════ BACKDROP + SHEETS ══════════ -->

  <!-- recently deleted -->
  <div class="sheet" id="sheet-trash">
    <div class="grabber"></div>
    <div class="sheet-head"><h2>Recently deleted</h2>
      <button class="ibtn" onpointerdown="closeSheets()" onclick="closeSheets()"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button>

/* persistence (degrades to memory inside the Arena preview) */
function save() { try { localStorage.setItem('tn_html_v3', JSON.stringify(state)) } catch(e){} try { scheduleSync() } catch(e){} }
/* ══ R34: collision-proof ids. `uid` used to restart at 100 on every load, so two
   tasks could end up sharing one id and 'act as one'. Repair splits twins (both
   survive, second gets a fresh id); newId() can never hand out an id in use. ══ */
function newId(){
  let n=++uid
  while(state.items.some(x=>String(x.id)===String(n))) n=++uid
  return n
}
function repairItemIds(){
  try{
    for(const it of state.items){ const n=parseInt(it.id,10); if(!isNaN(n)&&n>uid) uid=n }
    const seen=new Set()
    let changed=false
    for(const it of state.items){
      const k=String(it.id)
      if(seen.has(k)){ it.id=newId(); changed=true }
      seen.add(String(it.id))
    }
    return changed
  }catch(e){ return false }
}
function load() {
  try {
    const raw = localStorage.getItem('tn_html_v3')
    if (raw) { const s = JSON.parse(raw); if (s && s.lists && s.items) Object.assign(state, s) }
    // migrate: watch-status glow on Movies/Series/Anime (older saves lack the flag)
    ;['movies','series','anime'].forEach(id => { const l = state.lists.find(x => x.id === id); if (l) l.glow = true })
    if (!state.filters) state.filters = {}
    if (!state.pager) state.pager = 'home'
    state.items.forEach(i => { const l = state.lists.find(x => x.id === i.listId); if (l && l.kind === 'grocery') { i.due = ''; i.repeat = '' } })
  } catch(e){}
}

function esc(s){ return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;') }
function toast(msg, actLabel, actFn) {
  const el = $('toast')

  el.classList.add('show')
  clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove('show'), actLabel ? 5200 : 2200)

}

/* contrast-aware text for colored cards */
function needsLightText(css) {
  if (!css) return false
  if (css.startsWith('data:')) return true
  const m = (css.match(/#[0-9a-fA-F]{6}/g) || []).map(h => h.slice(1))
  if (m.length) {
    let s = 0
    for (const x of m) s += (0.299*parseInt(x.slice(0,2),16) + 0.587*parseInt(x.slice(2,4),16) + 0.114*parseInt(x.slice(4,6),16)) / 255
    return s / m.length < 0.62
  }
  return css.startsWith('linear-gradient')
}

function gotoPage(name) {

}

function openList(id) {

function swipePage(dir) {
  if (state.page !== 'home') return

/* gestures: horizontal swipe = 4 bottom-nav pages · swipe a row ← done / → remove · pull down = add */
;(function initGestures(){
  let active = false, mode = null, sx = 0, sy = 0, locked = false, moved = false
  let rowWrap = null, rowEl = null, pullBox = null

  function suppressNextClick() {
    const kill = e => { e.stopPropagation(); e.preventDefault(); window.removeEventListener('click', kill, true) }
    window.addEventListener('click', kill, true)
  }
  function begin(x, y, t) {
    if (document.querySelector('.sheet.open')) { active = false; return }
    active = true; mode = null; locked = false; moved = false
    sx = x; sy = y
    rowWrap = t && t.closest ? t.closest('.rowwrap') : null
    if (t && t.closest && t.closest('button, input, textarea, select')) rowWrap = null // taps on controls stay taps
    rowEl = rowWrap ? rowWrap.querySelector('.row, .g-row') : null
    pullBox = t && t.closest ? t.closest('.rows') : null
    if (pullBox && pullBox.scrollTop > 0) pullBox = null
    if (pullBox && !currentListId()) pullBox = null   // pull-to-add only inside a list
  }
  function track(x, y) {
    if (!active) return
    const dx = x - sx, dy = y - sy
    if (!locked && Math.abs(dx) + Math.abs(dy) > 9) {
      locked = true
      if (Math.abs(dx) > Math.abs(dy)) mode = rowWrap ? 'row' : (state.page === 'home' ? 'page' : 'none')
      else mode = pullBox ? 'pull' : 'none'
    }
    if (mode === 'row' && rowEl) {
      moved = true
      if (rowWrap) rowWrap.style.setProperty('--sw', Math.min(140, Math.abs(dx)) + 'px')
      if (rowWrap && Math.abs(dx) > 10) { rowWrap.classList.add('swiping'); rowWrap.dataset.dir = dx > 0 ? 'right' : 'left' }
      rowEl.style.transition = 'none'
      rowEl.style.transform = 'translateX(' + Math.max(-140, Math.min(140, dx)) + 'px)'
    } else if (mode === 'pull' && pullBox) {
      moved = true
      const d = Math.min(110, Math.max(0, dy) * 0.55)
      pullBox.style.transition = 'none'
      pullBox.style.transform = 'translateY(' + d + 'px)'
      const hint = $('pull-hint')
      hint.classList.add('show')
      hint.textContent = d > 46 ? 'Release to add' : 'Pull down to add'
    }
  }
  try{ window.__tn_track = track }catch(e){}
  function end(x, y) {
    if (!active) return
    active = false
    const dx = x - sx, dy = y - sy
    if (mode === 'row' && rowEl) {
      rowEl.style.transition = ''
      rowEl.style.transform = ''
      rowWrap.classList.remove('swiping'); delete rowWrap.dataset.dir
      const id = rowWrap.dataset.id
      if (dx <= -70) toggleDone(id)          // swipe left → mark done
      else if (dx >= 70) swipeRemove(id)     // swipe right → remove
    } else if (mode === 'pull' && pullBox) {
      pullBox.style.transition = ''
      pullBox.style.transform = ''
      $('pull-hint').classList.remove('show')
      if (dy >= 60) openComposer()
    } else if (mode === 'page') {
      if (Math.abs(dx) > 64 && Math.abs(dx) > Math.abs(dy) * 1.8) swipePage(dx < 0 ? 1 : -1)
    }
    if (moved) suppressNextClick()
    mode = null
  }
  function cancel() {
    if (!active) return
    active = false
    if (rowEl) { rowEl.style.transition = ''; rowEl.style.transform = ''; if (rowWrap) rowWrap.classList.remove('swiping'); delete rowWrap.dataset.dir }
    if (pullBox) { pullBox.style.transition = ''; pullBox.style.transform = '' }
    $('pull-hint').classList.remove('show')
    mode = null
  }

  const app = $('app')
  app.addEventListener('touchstart', e => begin(e.touches[0].clientX, e.touches[0].clientY, e.target), { passive:true })
  app.addEventListener('touchmove', e => {
    track(e.touches[0].clientX, e.touches[0].clientY)
    if (mode === 'row' || mode === 'pull') e.preventDefault()
  }, { passive:false })
  app.addEventListener('touchend', e => end(e.changedTouches[0].clientX, e.changedTouches[0].clientY), { passive:true })
  app.addEventListener('touchcancel', cancel, { passive:true })

  app.addEventListener('mousedown', e => { if (e.button === 0) begin(e.clientX, e.clientY, e.target) })
  window.addEventListener('mousemove', e => track(e.clientX, e.clientY))
  window.addEventListener('mouseup', e => end(e.clientX, e.clientY))

  window.addEventListener('keydown', e => {
    if (document.querySelector('.sheet.open')) return
    if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return
    if (e.key === 'ArrowLeft') swipePage(-1)
    if (e.key === 'ArrowRight') swipePage(1)
    if (e.key === 'Escape') { closeMenu(); closeSheets() }
  })
})()

function cardStyleCss(style) {
  if (!style) return 'background:var(--surface2)'

}
function renderHome() {

    const fg = light ? '#fff' : 'var(--text)'

        ${(light && (list.style?.color || list.style?.image)) ? '<div style="position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.28),transparent 55%);pointer-events:none"></div>' : ''}
        <button class="stylebtn" onclick="event.stopPropagation();openStyle('${list.id}')" aria-label="Card background"
                style="color:${light ? '#fff' : 'var(--sub)'}; background:${light ? 'rgba(0,0,0,.25)' : 'rgba(255,255,255,.6)'}">
          ${PALETTE}
        </button>
        <div class="inner" role="button" tabindex="0">

          ${open.slice(0,3).map(i => `

function renderListView(list, contentId, clearId) {

  const doneN = items.filter(i => i.done).length

const STATUS_LABEL = { towatch:'To watch', watching:'Watching' }
const STATUS_RANK = { watching:0, towatch:1 }   // ongoing always up top (red/watched removed)
function findItem(id) { return state.items.find(x => String(x.id) === String(id)) } // onclick ids arrive as strings

/* ══ R32: quiet-check completion celebration (preview #8). Confetti + row exit together, ~1.1s.
   Fullscreen overlay blocks ALL input during the window; one tap anywhere skips it instantly. ══ */
let _fxRunning=false
function rowFor(id){
  try{
    const s="toggleDone('"+id+"')"
    const btns=document.querySelectorAll('.check')
    let fallback=null
    for(const b of btns){
      if((b.getAttribute('onclick')||'').indexOf(s)>=0){
        const r=b.closest('.row')||b.closest('.g-row')||b
        if(r.offsetParent!==null) return r
        if(!fallback) fallback=r
      }
    }
    return fallback
  }catch(e){ return null }
}
function playDoneFX(rowEl, circleEl, onEnd){
  if(_fxRunning){ try{ onEnd&&onEnd() }catch(e){} return }
  _fxRunning=true
  let finished=false, raf=0
  const anims=[]
  let ov=null, cv=null, targetRow=null
  function end(skipped){
    if(finished) return
    finished=true
    _fxRunning=false
    try{ if(raf)cancelAnimationFrame(raf) }catch(e){}
    if(skipped){ anims.forEach(a=>{ try{ a.finish() }catch(e){} }) }
    try{ if(targetRow)targetRow.style.pointerEvents='' }catch(e){}
    try{ if(ov&&ov.remove)ov.remove() }catch(e){}
    try{ if(cv&&cv.remove)cv.remove() }catch(e){}
  }
  try{
    ov=document.createElement('div'); ov.id='fx-overlay'
    const cm=document.createElement('div'); cm.id='fx-check'
    cm.innerHTML='<svg width="84" height="84" viewBox="0 0 84 84"><circle cx="42" cy="42" r="38" fill="#188038"/><path d="M24 43l13 13 24-27" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>'
    ov.appendChild(cm)
    cv=document.createElement('canvas'); cv.id='fx-canvas'
    document.body.appendChild(ov); document.body.appendChild(cv)
    ov.addEventListener('click',function(e){ e.stopPropagation(); e.preventDefault(); end(true) },{once:true})
  }catch(e){ end(true); try{ onEnd&&onEnd() }catch(e2){} return }

  /* ── capture FIRST: pre-render geometry of every row in the list ── */
  const wrap0=(rowEl&&rowEl.closest)?rowEl.closest('.rowwrap'):null
  const container=wrap0?wrap0.parentElement:null
  const idAttr=wrap0?wrap0.dataset.id:null
  let firstTop=0
  const firstTops=new Map()
  try{
    firstTop=rowEl.getBoundingClientRect().top
    container.querySelectorAll('.rowwrap[data-id]').forEach(w=>{ firstTops.set(String(w.dataset.id), w.getBoundingClientRect().top) })
  }catch(e){}

  /* ── commit NOW: done-state renders into its final place immediately ── */
  try{ onEnd&&onEnd() }catch(e){}

  /* ── micro-particles from the original check-circle position (demo #8) ── */
  try{
    const rect=circleEl&&circleEl.getBoundingClientRect?circleEl.getBoundingClientRect():null
    const W=cv.width=Math.round(window.innerWidth), H=cv.height=Math.round(window.innerHeight)
    const ctx=cv.getContext&&cv.getContext('2d')
    if(ctx&&rect){
      const colors=['#1a73e8','#fbbc04','#34a853','#ea4335','#a142f4','#00acc1']
      const parts=[]
      const cx=rect.left+rect.width/2, cy=rect.top+rect.height/2
      for(let n=0;n<10;n++){
        const a=Math.random()*Math.PI*2, sp=.05+Math.random()*.11
        parts.push({x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-.04,s:3+Math.random()*2,c:colors[n%colors.length],prev:0})
      }
      const t0=performance.now()
      const tick=function(now){
        if(finished) return
        const age=now-t0
        ctx.clearRect(0,0,W,H)
        if(age>1100) return
        for(const p of parts){
          const dt=Math.min(now-(p.prev||now),60); p.prev=now
          p.vy+=0.00042*dt; p.x+=p.vx*dt; p.y+=p.vy*dt
          ctx.globalAlpha=Math.max(0,1-age/1100)
          ctx.fillStyle=p.c
          ctx.beginPath(); ctx.arc(p.x,p.y,p.s/2,0,7); ctx.fill()
        }
        raf=requestAnimationFrame(tick)
      }
      raf=requestAnimationFrame(tick)
    }
  }catch(e){}

  /* ── FLIP: rows close rank upward while the done row FALLS through the
     list to its new home at the bottom - it visibly scrolls past every
     task on its way, then lands with a tiny settle. ~0.85s of fall. ── */
  try{
    if(container&&idAttr!=null&&container.querySelectorAll){
      const wraps=container.querySelectorAll('.rowwrap[data-id]')
      for(const w of wraps){
        const wid=String(w.dataset.id)
        const oldTop=firstTops.has(wid)?firstTops.get(wid):null
        const newTop=w.getBoundingClientRect().top
        if(wid===String(idAttr)){
          const r2=w.querySelector('.row')||w.querySelector('.g-row')
          targetRow=r2||w
          try{ targetRow.style.pointerEvents='none' }catch(e){}
          const delta=firstTop-newTop
          if(Math.abs(delta)>1&&targetRow.animate){
            const a=targetRow.animate([
              {transform:'translateY('+delta+'px)',easing:'cubic-bezier(.55,.05,.85,.4)'},
              {transform:'translateY(4px)',offset:.9,easing:'cubic-bezier(.2,.7,.3,1)'},
              {transform:'translateY(0)'}
            ],{duration:850})
            anims.push(a)
            a.onfinish=function(){ end(false) }
          }
        }else if(oldTop!=null&&Math.abs(oldTop-newTop)>1&&w.animate){
          const s=w.animate([{transform:'translateY('+(oldTop-newTop)+'px)'},{transform:'translateY(0)'}],{duration:420,easing:'cubic-bezier(.25,.6,.3,1)'})
          anims.push(s)
        }
      }
    }
  }catch(e){}

  setTimeout(function(){ end(false) },1150)
}
function toggleDone(id) {
  const i = findItem(id); if (!i) return
  if (i.habit && !i.done) return rollHabit(i)
  i.done = !i.done
  if (i.done && i.repeat) toast('Done — repeating reminder stopped')
  const finish=function(){
    renderList(); save()
    try{ if(document.activeElement&&document.activeElement.blur)document.activeElement.blur() }catch(e){}
  }
  const row=(i.done && typeof rowFor==='function')?rowFor(id):null
  if(row && typeof playDoneFX==='function'){
    try{ playDoneFX(row, row.querySelector('.check'), finish); return }catch(e){}
  }
  finish()
}
function toggleHabitChip() {
  $('item-habit-chip').classList.toggle('on')
}
/* habits: done once -> rolls to the next period, keeps reminding forever.
   Cadence = repeat if it is >= 1 day, else daily (sub-daily repeats are the nag rate). */
function habitPeriodMs(i) {
  const m = (typeof repeatToMinutes === 'function') ? repeatToMinutes(i.repeat) : null
  return m && m >= 1440 ? m * 60000 : 864e5
}
function habitLabel(i) {
  const m = (typeof repeatToMinutes === 'function') ? repeatToMinutes(i.repeat) : null
  return m && m >= 1440 ? i.repeat : 'daily'
}
function fmtDue(date) {
  const p = osloParts(date.getTime())
  const now = osloParts(Date.now())
  const wd = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][new Date(Date.UTC(p.y,p.mo-1,p.d)).getUTCDay()]
  const mo = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][p.mo-1]
  const time = pad2(p.H) + ':' + pad2(p.M)
  const dayDiff = Math.round((Date.UTC(p.y, p.mo - 1, p.d) - Date.UTC(now.y, now.mo - 1, now.d)) / 864e5)
  if (dayDiff === 0) return 'Today, ' + time
  if (dayDiff === 1) return 'Tomorrow, ' + time
  return wd + ' ' + p.d + ' ' + mo + (p.y !== now.y ? ' ' + p.y : '') + ', ' + time
}
function dueText(i) {
  if (!i.due) return ''
  try {
    const ep = (typeof parseDue === 'function') ? parseDue(i.due) : null
    return ep ? fmtDue(new Date(ep)) : i.due
  } catch (e) { return i.due }
}
function rollHabit(i) {
  const period = habitPeriodMs(i)
  const anchor = (i.due && typeof parseDue === 'function') ? parseDue(i.due) : null
  const anchorT = anchor ? new Date(anchor).getTime() : 0
  const loggedRecently = i.habitLoggedAt && (Date.now() - new Date(i.habitLoggedAt).getTime()) < period
  if (loggedRecently && anchorT > Date.now()) {
    toast('Already logged ✓ next ' + i.due)
    return
  }
  let t = anchorT ? anchorT + period : Date.now() + period
  while (t <= Date.now()) t += period
  i.due = fmtDue(new Date(t))
  i.habitLoggedAt = new Date().toISOString()
  save()
  state.page === 'home' ? renderHome() : renderList()
  toast('✓ Logged — next ' + i.due)
}
function toggleStar(id) {
  const i = findItem(id); if (!i) return
  i.star = !i.star
  renderList()
}
function clearCompleted(listId) {
  const id = listId || state.page
  const before = state.items.length
  const removed = state.items.filter(i => i.listId === id && i.done)
  removed.forEach(toTrash)
  state.items = state.items.filter(i => !(i.listId === id && i.done))
  renderList()
  const n = before - state.items.length
  if (n) { undoRemove(removed, `Removed ${n} completed`); confetti() } else toast('No completed items')
}

/* ══ TEST round: trash/undo · badge · confetti · styles · due sort ══ */
function toTrash(i){ (state.trash = state.trash || []).push(Object.assign({}, i, { deletedAt: Date.now() })); while (state.trash.length > 60) state.trash.shift() }
function undoRemove(removed, msg) {
  toast(msg || 'Removed', 'UNDO', () => { removed.forEach(r => state.items.push(r)); renderList(); save(); toast('Restored ✓') })
}
function confetti(){
  try{
    const colors=['#1a73e8','#34a853','#fbbc04','#ea4335','#a142f4','#ff6d00']
    for(let n=0;n<26;n++){
      const b=document.createElement('div')

function bindSheetGestures(){
  try{
    document.querySelectorAll('.sheet').forEach(sh=>{
      if (sh._bound) return
      sh._bound = true
      let sy=0, dy=0, dragging=false
      sh.addEventListener('touchstart', e=>{
        const c = e.target && e.target.closest ? e.target.closest('.content') : null
        if (c && c.scrollTop > 0) return
        sy = e.touches[0].clientY; dy = 0; dragging = true
        sh.style.transition = 'none'
      }, { passive:true })
      sh.addEventListener('touchmove', e=>{
        if (!dragging) return
        dy = e.touches[0].clientY - sy
        if (dy > 0) sh.style.transform = 'translateY(' + Math.min(dy, 340) + 'px)'
      }, { passive:true })
      sh.addEventListener('touchend', ()=>{
        if (!dragging) return
        dragging = false
        sh.style.transition = ''
        sh.style.transform = ''
        if (dy > 80) closeSheets()
      })
      sh.addEventListener('touchcancel', ()=>{
        if (!dragging) return
        dragging = false
        sh.style.transition = ''
        sh.style.transform = ''
      })
    })
  }catch(e){}
}

function dueToPair(val, tId, dId){

function rollPastDue(dueStr){
  try{
    if(!dueStr)return dueStr
    const ep=(typeof parseDue==='function')?parseDue(dueStr):null
    if(!ep)return dueStr
    const t=new Date(ep).getTime()
    if(t>Date.now())return dueStr
    const p=osloParts(t)
    for(let k=1;k<370;k++){
      const box=new Date(Date.UTC(p.y,p.mo-1,p.d+k))
      const cand=box.getUTCFullYear()+'-'+pad2(box.getUTCMonth()+1)+'-'+pad2(box.getUTCDate())+'T'+pad2(p.H)+':'+pad2(p.M)
      const t2=new Date(osloToEpoch(cand.slice(0,16))).getTime()
      if(t2>Date.now()){ toast('Due '+fmtDue(new Date(t2))); return cand }
    }
    return dueStr
  }catch(e){ return dueStr }
}
function submitComposer() {
  let raw = $('composer-input').value.trim()
  if (!raw) return
  $('composer-input').value = ''

  let listId = composerTarget, cat = null, qty = null, unit = ''
  let smartStar = false
  {
    const tagM = raw.match(/#([a-z0-9æøå-]+)/i)
    if (tagM) {
      const key = tagM[1].toLowerCase()
      const hit = state.lists.find(l => l.kind === key || String(l.id) === key || l.name.toLowerCase().split(/\s+/)[0] === key)
      if (hit) listId = hit.id
      raw = raw.replace(tagM[0], ' ')
    }
    const gl = state.lists.find(l => l.id === listId)
    if (!(gl && gl.kind === 'grocery')) {
      if (/[*⭐]/.test(raw)) { smartStar = true; raw = raw.replace(/[*⭐]/g, ' ') }
      const tmM = raw.match(/\b(?:at |kl\.?\s*)?(\d{1,2}):(\d{2})\b/i)
      const dayM = raw.match(/\b(today|tomorrow|i dag|idag|i morgen|imorgen|i morgon|monday|tuesday|wednesday|thursday|friday|saturday|sunday|mandag|tirsdag|onsdag|torsdag|fredag|lørdag|søndag|måndag|tysdag|laurdag|sundag)\b/i)
      let dayOk = true
      if (dayM && dayM.index >= 6) {
        const before = raw.slice(Math.max(0, dayM.index - 8), dayM.index).toLowerCase()
        if (/(every|hver|kvar)\s+$/.test(before)) dayOk = false
      }
      const dayTxt = (dayM && dayOk) ? dayM[0] : ''
      const timeTxt = tmM ? tmM[1] + ':' + tmM[2] : ''
      if (dayTxt || timeTxt) {
        const ep = (typeof parseDue === 'function') ? parseDue((dayTxt + ' ' + timeTxt).trim()) : null
        if (ep) {
          const pp = osloParts(new Date(ep).getTime())
          $('composer-time').value = pad2(pp.H) + ':' + pad2(pp.M)
          $('composer-date').value = pp.y + '-' + pad2(pp.mo) + '-' + pad2(pp.d)
        }
        if (dayM && dayOk) raw = raw.replace(dayM[0], ' ')
        if (tmM) raw = raw.replace(tmM[0], ' ')
      }
    }
    raw = raw.replace(/\s+/g, ' ').trim()
  }
  const qm = raw.match(/(\d+[.,]?\d*)\s*(kg|g|l|dl|ml|stk|pk|x)?\b/i)
  const lower = raw.toLowerCase()

  // items always go to the list you're adding from; food in the Grocery list sorts into aisles
  const targetList = state.lists.find(l => l.id === listId)
  if (targetList && targetList.kind === 'grocery') {
    for (const [c, re] of Object.entries(FOOD)) {
      if (new RegExp('\\b(' + re + ')\\b').test(lower)) {
        cat = c
        if (qm) { qty = parseFloat(qm[1].replace(',', '.')); unit = qm[2] && qm[2].toLowerCase() !== 'x' ? qm[2].toLowerCase() : '' }
        break
      }
    }
    if (qm && !cat && qm[2]) { qty = parseFloat(qm[1].replace(',', '.')); unit = qm[2].toLowerCase() !== 'x' ? qm[2].toLowerCase() : '' }
  }
  const repM = raw.match(/\b(?:every|hver|kvar)\s+\d*\s*(minutter|minutt|min|minutes?|timer|timar|time|hours?|dager|dagar|dag|days?|uker|uke|veker|veke|weeks?)\b/i)
  let title = raw
    .replace(/\b(every|hver|kvar)\s.*$/i, '')
    .replace(/(\d+[.,]?\d*)\s*(kg|g|l|dl|ml)\b/gi, '')
    .trim() || raw

  const isGroc = !!(targetList && targetList.kind === 'grocery')
  const item = {
    id:newId(), listId, title,
    note:'', done:false, star: !!smartStar,
    due: isGroc ? '' : rollPastDue(dueFromPair('composer-time', 'composer-date')),
    repeat: isGroc ? '' : ($('composer-repeat-chips').dataset.value || (repM ? repM[0].toLowerCase() : '')),
    habit: !isGroc && $('composer-habit-chip').classList.contains('on'),
    qty: qty, unit: unit, cat,
  }
  state.items.unshift(item)
  dueToPair('', 'composer-time', 'composer-date')
  const list = state.lists.find(l => l.id === listId)
  closeSheets()
  openList(listId)
  toast(`Added to ${list ? list.name : 'list'} ✓`)
}

function onStylePhoto(input) {
  const file = input.files && input.files[0]
  if (!file) return
  const reader = new FileReader()
  reader.onload = () => {
    const img = new Image()
    img.onload = () => {
      const maxW = 720
      const scale = Math.min(1, maxW / img.width)
      const c = document.createElement('canvas')
      c.width = Math.round(img.width * scale)
      c.height = Math.round(img.height * scale)
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height)
      applyStyle({ image: `url(${c.toDataURL('image/jpeg', .72)})` })

}

function urlB64ToU8(base64String){

/* parse "tomorrow 09:00", "17:30", "Wed, 11 Nov", "11 Nov", "in 2 hours" … */
const _MONTHS={jan:0,feb:1,mar:2,apr:3,mai:4,may:4,jun:5,jul:6,aug:7,sep:8,okt:9,oct:9,nov:10,des:11,dec:11};
const _WDAYS={sun:0,øn:0,sundag:0,mon:1,man:1,mån:1,måndag:1,tue:2,tir:2,tys:2,wed:3,ons:3,thu:4,tor:4,fri:5,fre:5,sat:6,lør:6,lau:6};
const TN_TZ='Europe/Oslo';
function osloOffsetMs(ts){
  const dtf=new Intl.DateTimeFormat('en-US',{timeZone:TN_TZ,hour12:false,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'});
  const p={};dtf.formatToParts(new Date(ts)).forEach(x=>{p[x.type]=x.value});
  const asUTC=Date.UTC(+p.year,+p.month-1,+p.day,(+p.hour)%24,+p.minute,+p.second);
  return asUTC-Math.floor(ts/1000)*1000;
}
function osloToEpoch(naive){
  const s=(naive||'').trim().replace(' ','T').slice(0,16);
  const guess=Date.parse(s+':00Z');
  if(isNaN(guess))return NaN;
  return guess-osloOffsetMs(guess);
}
function osloParts(ts){
  const dtf=new Intl.DateTimeFormat('en-US',{timeZone:TN_TZ,hour12:false,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
  const p={};dtf.formatToParts(new Date(ts)).forEach(x=>{p[x.type]=x.value});
  return {y:+p.year,mo:+p.month,d:+p.day,H:(+p.hour)%24,M:+p.minute};
}
function parseDue(text){
  const raw=(text||'').trim();if(!raw)return null;
  if(/^\d{4}-\d{2}-\d{2}/.test(raw)){
    const hasTz=/[zZ]|[+-]\d{2}:?\d{2}$/.test(raw);
    const t=hasTz?Date.parse(raw):osloToEpoch(raw.slice(0,16));
    if(!isNaN(t))return new Date(t).toISOString();
  }
  const s=' '+raw.toLowerCase().replace(/[.,]/g,' ').replace(/\s+/g,' ')+' ';
  const now=new Date();
  const rel=s.match(/\b(?:in|om|i)\s+(\d+)\s+([a-zæøå]+)/);
  if(rel){
    const U={minute:6e4,minutes:6e4,minutt:6e4,minutter:6e4,min:6e4,hour:36e5,hours:36e5,time:36e5,timer:36e5,timar:36e5,day:864e5,days:864e5,dag:864e5,dager:864e5,dagar:864e5,week:6048e5,weeks:6048e5,uke:6048e5,uker:6048e5,veke:6048e5,veker:6048e5,month:2592e6,months:2592e6,måned:2592e6,måneder:2592e6,månad:2592e6,månader:2592e6};
    const ms=(U[rel[2]]||U[rel[2].replace(/s$/,'')])*(parseInt(rel[1],10)||1);
    if(ms)return new Date(now.getTime()+ms).toISOString();
  }
  const o=osloParts(now.getTime());
  const box=(y,mo,d)=>new Date(Date.UTC(y,mo,d));
  let rest=s,base=null,hour=null,min=0,hasDayWord=false;
  let md=rest.match(/\b(\d{1,2}) (jan|feb|mar|apr|mai|may|jun|jul|aug|sep|okt|oct|nov|des|dec)[a-zæøå]*/);
  if(!md)md=rest.match(/\b(jan|feb|mar|apr|mai|may|jun|jul|aug|sep|okt|oct|nov|des|dec)[a-zæøå]* (\d{1,2})\b/);
  if(md){
    const a=md[1],b=md[2];
    const day=/^\d+$/.test(a)?parseInt(a,10):parseInt(b,10);
    const mon=_MONTHS[/^\d+$/.test(a)?b:a];
    base=box(o.y,mon,day);
    if(base<box(o.y,o.mo-1,o.d)){
      const wmHint=rest.match(/\b(sun|øn|mon|man|mån|tue|tir|tys|wed|ons|thu|tor|fri|fre|sat|lør|lau)[a-zæøå]*\b/);
      const keepThisYear=wmHint&&base.getUTCDay()===_WDAYS[wmHint[1]];
      if(!keepThisYear)base.setUTCFullYear(base.getUTCFullYear()+1);
    }
    rest=rest.replace(md[0],' ');hasDayWord=true;
  }
  if(!base){
    const wm=rest.match(/\b(sun|øn|mon|man|mån|tue|tir|tys|wed|ons|thu|tor|fri|fre|sat|lør|lau)[a-zæøå]*\b/);
    if(wm){
      base=box(o.y,o.mo-1,o.d);
      base.setUTCDate(base.getUTCDate()+((_WDAYS[wm[1]]-base.getUTCDay())+7)%7);
      rest=rest.replace(wm[0],' ');hasDayWord=true;
    }
  }
  if(!base&&/\b(tomorrow|i morgen|imorgen|i morgon)\b/.test(rest)){base=box(o.y,o.mo-1,o.d+1);rest=rest.replace(/\b(tomorrow|i morgen|imorgen|i morgon)\b/g,' ');hasDayWord=true;}
  if(!base&&/\b(today|i dag|idag)\b/.test(rest)){base=box(o.y,o.mo-1,o.d);rest=rest.replace(/\b(today|i dag|idag)\b/g,' ');hasDayWord=true;}
  const tm=rest.match(/\b(\d{1,2})(?::(\d{2}))?\s*(am|pm)?\b/);
  if(tm){
    hour=parseInt(tm[1],10);min=tm[2]?parseInt(tm[2],10):0;
    if(tm[3]==='pm'&&hour<12)hour+=12;
    if(tm[3]==='am'&&hour===12)hour=0;
  }
  if(!base){if(hour==null)return null;base=box(o.y,o.mo-1,o.d);}
  if(hour==null)hour=9;
  base.setUTCHours(hour,min,0,0);
  const nowBox=new Date(Date.UTC(o.y,o.mo-1,o.d,o.H,o.M));
  if(!hasDayWord&&base<=nowBox)base.setUTCDate(base.getUTCDate()+1);
  return new Date(osloToEpoch(base.toISOString().slice(0,16))).toISOString();
}
function repeatToMinutes(text){
  if(!text)return null;
  const m=String(text).toLowerCase().match(/(?:every|hver|kvar)\s*(\d*)\s*([a-zæøå]+)/);
  if(!m)return null;
  const U={minute:1,minutes:1,minutt:1,minutter:1,min:1,hour:60,hours:60,time:60,timer:60,timar:60,day:1440,days:1440,dag:1440,dager:1440,dagar:1440,week:10080,weeks:10080,uke:10080,uker:10080,veke:10080,veker:10080,month:43200,months:43200,måned:43200,måneder:43200,månad:43200,månader:43200};
  const unit=U[m[2]]||U[m[2].replace(/s$/,'')];
  return unit? (m[1]?parseInt(m[1],10):1)*unit : null;
}
